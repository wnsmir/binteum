name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Hosted Ubuntu images include Android command-line tools and SDK licenses.
      # Use only the required packages; the obsolete "tools" package is unavailable.
      - name: Ensure Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-34' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --no-daemon
